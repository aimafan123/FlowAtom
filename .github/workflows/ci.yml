name: Release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints-cpu.txt
      - name: Install CPU reference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -c requirements/constraints-cpu.txt -e '.[all,dev]'
          python -m pip check
      - name: Static checks
        run: |
          ruff check src scripts tests
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic end-to-end run
        run: PYTHON=python bash scripts/run_smoke_test.sh
      - name: Build source and wheel distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Verify installed wheel outside the checkout
        run: |
          python -m pip uninstall -y flowatom
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          flowatom --help
          python -c "from flowatom.config import load_config; assert load_config()['encoder']['input_length'] == 300"
          flowatom make-synthetic-data --output-dir installed-data --sites 6 --pretraining-flows 50
