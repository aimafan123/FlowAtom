[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flowatom"
dynamic = ["version"]
description = "FlowAtom: Atom-based evidence aggregation for multi-label website fingerprinting"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Chongru Fan" },
]
keywords = [
  "website-fingerprinting",
  "encrypted-traffic",
  "multi-label",
  "multi-instance-learning",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "pyarrow>=10",
  "scikit-learn>=1.2",
  "scipy>=1.9",
  "joblib>=1.2",
  "PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/aimafan123/FlowAtom"
Issues = "https://github.com/aimafan123/FlowAtom/issues"

[project.scripts]
flowatom = "flowatom.cli:main"

[project.optional-dependencies]
ml = ["torch>=2.0"]
atoms = ["xgboost>=2.0"]
all = [
  "torch>=2.0",
  "xgboost>=2.0",
]

dev = ["build>=1.2", "twine>=6", "ruff>=0.8,<1"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "flowatom.__version__"}

[tool.setuptools.package-data]
flowatom = ["configs/*.yaml"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
